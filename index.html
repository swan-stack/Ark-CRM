:root{--ark-font:'ArknPartners','Malgun Gothic','Apple SD Gothic Neo','맑은 고딕',sans-serif;}
  /* 예전 레이아웃/틀구조 유지 + HIG의 박스모양·그림자·색만 적용 */
  :root{
    --navy:#0f2440; --navy2:#1b3a63;
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd;
    --ink:#1d1d1f; --ink-2:#6e6e73; --muted:#8e8e93;
    --line:#e5e5ea; --line-2:#d2d2d7;
    --blue:#0071e3; --blue-tint:#eaf3fe;
    --green:#1a7f4b; --green-t:#e7f4ec; --amber:#8a6100; --amber-t:#fbf1dc;
    --purple:#5a41b0; --purple-t:#efeafc; --gray-t:#eef0f2;
    --fred:#b3261e; --forange:#b5771a; --ok:#1a7f4b; --drop:#b3261e;
    --radius:14px; --radius-sm:10px; --pill:980px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;min-width:820px}
  /* ===== 모바일 전용 뷰(#mwrap): 하단 탭 · 아코디언 카드. 데스크톱에선 숨김 ===== */
  #mwrap{display:none}
  @media(max-width:820px){
    body{min-width:0;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    header.top, .wrap{display:none!important}
    #mwrap{display:block}
  }
  #mwrap .mhead{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  #mwrap .mhead h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
  #mwrap .mhead .meta{margin-top:3px;font-size:11px;color:#9fb4d6}
  #mwrap main{display:block;height:auto;overflow:visible;padding:14px 12px 0;background:transparent}
  #mwrap .searchwrap{margin-bottom:12px}
  #mwrap input[type=search]{width:100%;padding:11px 13px;font-size:15px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);-webkit-appearance:none;appearance:none}
  #mwrap .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  #mwrap .stat{background:var(--navy);color:#fff;border-radius:11px;padding:11px 8px;text-align:center}
  #mwrap .stat b{display:block;font-size:20px;line-height:1.1;font-weight:700}
  #mwrap .stat span{font-size:10.5px;color:#9fb4d6}
  #mwrap .mcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
  #mwrap .chead{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;cursor:pointer}
  #mwrap .chead .nm{flex:1;min-width:0}
  #mwrap .chead .nm strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.3px}
  #mwrap .chead .nm .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  #mwrap .chead .rt{text-align:right;flex-shrink:0}
  #mwrap .chead .rt .d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  #mwrap .chead .rt .ago{font-size:10.5px;color:#a4a19a;margin-top:1px}
  #mwrap .mtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:5px;vertical-align:1px;margin-right:4px}
  #mwrap .t-ovs{background:var(--navy2,#183456);color:#fff}
  #mwrap .t-plain{background:var(--bg);color:var(--muted)}
  #mwrap .mbadge{display:inline-block;background:#f7efd6;color:#8a6d1a;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;border:1px solid #e6d29a}
  #mwrap .stale{color:#b4472a!important;font-weight:700}
  #mwrap .cbody{display:none;border-top:1px solid var(--line);padding:11px 13px 13px;background:#fcfcfb}
  #mwrap .mcard.open .cbody{display:block}
  #mwrap .mrow{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  #mwrap .mrow b{color:var(--navy);font-weight:700}

  /* Header (예전 위치: 네이비 바) */

  /* Sidebar (예전 구조) — 독립 스크롤(본문 스크롤해도 안 움직임) */

  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;font-family:inherit;background:var(--surface-2)}

  .sortrow{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:11px;color:var(--muted)}
  .sortopt{cursor:pointer;padding:3px 9px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:560}

  .row-tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .tierbadge{font-size:11px;padding:2px 8px;border-radius:var(--pill);font-weight:640;white-space:nowrap}

  .ftag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill)}

  .badge{font-size:11px;padding:2px 8px;border-radius:var(--pill);background:var(--gray-t);color:var(--ink-2);font-weight:560}
  .lpitem.active .badge{background:rgba(255,255,255,.16);color:#fff}

  .adminadd{margin-top:6px;font-size:13px;font-weight:560;text-align:center;padding:10px;border:1px dashed var(--line-2);border-radius:12px;color:var(--blue);cursor:pointer;background:var(--surface)}

  /* Main (예전 구조 · 회색 배경 + 흰 박스) */
  main{padding:22px 26px 50px;overflow:auto;background:var(--bg);height:100%}
  /* 상세 상단(제목~통계)을 담당자 전까지 고정 */
  .lptop{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:2px;padding-bottom:6px;border-bottom:1px solid transparent}

  h3.sec{font-size:12px;font-weight:640;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}

  .contacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ctc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
  .ctc b{color:var(--ink);font-weight:620}.ctc span{color:var(--muted);font-size:12px}.ctc .em{color:var(--blue);font-size:12px}.ctc .x{cursor:pointer;color:var(--drop);font-weight:700}.ctc .ed{cursor:pointer;color:var(--blue);font-weight:700}
  .ctc.dropbefore{box-shadow:-3px 0 0 var(--blue)}
  .ctc[draggable=true]{cursor:grab}.ctc .grip{color:var(--line-2);font-size:12px;cursor:grab;user-select:none}.ctc.dragging{opacity:.4}
  .ctcsec{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:46px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);transition:.12s}
  .ctcsec.drop{border-color:var(--blue);background:var(--blue-tint)}
  .ctclabel{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 7px;text-transform:uppercase;letter-spacing:.04em}
  h3.sec .mini2{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:auto}
  .tieradmin{font-size:11px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tieradmin input{width:52px;padding:2px 6px;border:1px solid var(--line-2);border-radius:6px;font-family:inherit;font-size:11px;text-align:right}

  .tiersec.t2{background:#eaeef4;border-color:#d4dae4}
  .tiersec.t3{background:#f4f4f6;border-color:#e6e6ea}
  .tierhdr{display:flex;align-items:baseline;gap:8px;margin:2px 2px 9px;padding:8px 12px;border-radius:9px}
  .tierhdr .tl{font-weight:800;letter-spacing:.02em}
  .tierhdr .td{font-size:11px}
  .tierhdr.t1{background:var(--navy)}.tierhdr.t1 .tl{color:#f4d98b;font-size:14px}.tierhdr.t1 .td{color:#cdd6e4}
  .tierhdr.t2{background:#3f5170}.tierhdr.t2 .tl{color:#fff;font-size:13px}.tierhdr.t2 .td{color:#c7d0de}
  .tierhdr.t3{background:#e4e6ea}.tierhdr.t3 .tl{color:var(--ink-2);font-size:12.5px}.tierhdr.t3 .td{color:var(--muted)}
  .nsbtn{font-size:10.5px;font-weight:640;padding:1.5px 8px;border-radius:var(--pill);border:1px solid var(--line);cursor:pointer;margin-right:8px;font-family:inherit;vertical-align:middle}
  .nsbtn.on{background:var(--green-t);color:var(--green);border-color:transparent}
  .nsbtn.off{background:#fdecea;color:var(--drop);border-color:transparent}
  .atbl tr.rowhide td{background:#eef0f4}
  .atbl tr.rowhide b{color:var(--muted)}
  .hidetag{font-size:10px;font-weight:700;color:var(--drop);margin-left:6px}
  .tl{position:relative;margin-left:8px;padding-left:24px;border-left:2px solid var(--line)}
  .ev{position:relative;margin-bottom:18px}
  .ev::before{content:"";position:absolute;left:-31px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--navy)}
  .ev .date{font-size:12px;color:var(--muted);font-weight:600}

  .pending-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}

  .btn{font-size:13px;font-weight:560;padding:7px 16px;border-radius:var(--pill);border:none;cursor:pointer;letter-spacing:-0.01em;transition:.12s}

  .btn.rej{background:var(--gray-t);color:var(--ink)}.btn.rej:hover{background:#e3e5e8}

  .btn:disabled{opacity:.45;cursor:default}
  .empty{color:var(--muted);font-size:13px;font-style:italic}
  /* admin table */
  .atbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}

  .ev.arch .txt{color:var(--ink-2)}

  /* ===== r30: ARK PMS 다크 블루 톤 + ArknPartners 서체 ===== */
  :root{color-scheme:dark;
    --navy:#12233b; --navy2:#a9b8cf; --lime:#c7e56b; --act:#8fb6ff;
    --bg:#0d1a2e; --surface:#16273f; --surface-2:#1a2c46; --panel2:#1e3252;
    --ink:#e6edf6; --ink-2:#b9c6d8; --muted:#93a4bd;
    --line:#2b3d5c; --line-2:#3a4d70;
    --blue:#8fb6ff; --blue-tint:rgba(143,182,255,.13);
    --green:#3fbf97; --green-t:rgba(63,191,151,.15); --amber:#e0a127; --amber-t:rgba(224,161,39,.15);
    --purple:#c2abee; --purple-t:rgba(163,133,208,.18); --gray-t:#1e3252;
    --fred:#c4473b; --forange:#c98a2b; --ok:#2aa58f; --drop:#e06a5a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 6px 18px rgba(0,0,0,.42);
  }
  body{background:var(--bg);color:var(--ink);font-family:'ArknPartners',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;text-rendering:optimizeLegibility}
  button,input,select,textarea{font-family:inherit}
  .arklogo{display:block;height:17px;width:190px;max-width:42vw;background:var(--arklogo) no-repeat left center/contain;opacity:.96;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand .sep{opacity:.35;font-weight:300}
  .brand .ttl{font-weight:300;letter-spacing:3px;font-size:15px;white-space:nowrap}
  .brand .ttl b{font-weight:700}
  header.top{background:rgba(15,29,49,.86);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(0,0,0,.35);box-shadow:0 6px 18px rgba(0,0,0,.28)}
  header.top .cyc{color:#9fb0c4}
  .hbtn{background:#1b2b46;border:1px solid #34517b;color:#cfdbea;font-weight:600;border-radius:9px}
  .hbtn:hover{background:#22365a;border-color:#4a5f85}
  .hbtn.on{background:var(--lime);border-color:var(--lime);color:var(--navy)}
  .who{background:#1b2b46;border-color:#34517b;color:#cfdbea}
  aside{background:#10203a;border-right:1px solid var(--line)}
  .snapbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px;padding:10px 13px;border-radius:11px;border:1px solid #2f6d63;background:linear-gradient(160deg,#20405e,#16273f);color:#fff;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s}
  .snapbtn:hover{border-color:var(--lime)}.snapbtn:active{transform:scale(.98)}
  .snapbtn .ar{color:var(--lime);font-size:15px}
  .snapbtn.on{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
  .tab{background:#1b2b46;border-color:#2b3d5c;color:#9fb0c4}
  .tab.on{background:var(--lime);color:var(--navy);border-color:var(--lime)}
  .sortopt{background:#1b2b46;border-color:var(--line);color:#9fb0c4}
  .sortopt.on{background:var(--lime);color:var(--navy);border-color:var(--lime)}
  .search{background:#1b2b46;border-color:var(--line);color:var(--ink)}
  .search:focus{outline:2px solid var(--act);background:#1e3252}
  .lpitem{background:var(--surface);border-color:var(--line)}
  .lpitem:hover{border-color:#3a4d70}
  .lpitem.active{background:#20405e;border-color:var(--lime)}
  .lpitem.active .meta{color:#b9c6d8}
  .tiersec.t1{background:rgba(199,229,107,.05);border-color:rgba(199,229,107,.22)}
  .tiersec.t2{background:rgba(143,182,255,.05);border-color:#2b3d5c}
  .tiersec.t3{background:rgba(255,255,255,.02);border-color:#22324d}

<script>
/* ===== 공유 데이터 계약 (실운영: SharePoint의 lp_crm_data.json) — 스키마·로직 불변 ===== */
let DATA = null;
/* ===== state ===== */
let activeId="woori-bank", adminMode=false, viewMode="detail", regionTab="전체", sortMode="invest", adminHintShown=false, lastReject=null, lastDelLog=null;
let currentUser="게스트";
/* 모바일: 보기 + 승인대기 처리만, 관리자 기능은 PC에서만 */
const IS_MOBILE=(function(){try{return (window.matchMedia&&window.matchMedia('(max-width:820px)').matches)||/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');}catch(e){return false;}})();
try{if(IS_MOBILE)document.body.classList.add('mobile');}catch(e){}
const relLabel={lp:"LP · 출자",lender:"대주 · 차입",borrow:"차입처"};
const srcLabel={teams:"Teams",email:"메일",calendar:"일정"};
let ingested=new Set();
function rebuildLedger(){ingested=new Set();(DATA&&DATA.lps?DATA.lps:[]).forEach(lp=>lp.logs.forEach(l=>ingested.add(l.msg)));((DATA&&DATA.archivedMsgs)||[]).forEach(m=>ingested.add(m));}
rebuildLedger();

/* ===== 아카이브 (읽기 전용 과거 로그: lp_crm_archive_*.json) ===== */
let ARCHIVES=[]; // [{range, byLp:{lpId:[log,...]}}]
function archLogs(lpid){const out=[];ARCHIVES.forEach(a=>{(a.byLp[lpid]||[]).forEach(l=>out.push(l));});out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));return out;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isFuture(d){return !!(d && (''+d).slice(0,10) > todayStr());} /* 오늘 이후 날짜 = 미래(수집됐어도 승인대기에서 숨김) */
/* ===== 개인 pending 파일 병합 (harvest는 본체를 안 쓰고 lp_crm_pending_<user>.json에만 씀; 대시보드는 읽어서 병합만) ===== */
let EXTPEND={}; // lpId -> [pending item...]
function mergeExtPending(obj){ if(!obj||!Array.isArray(obj.items))return 0; let n=0; obj.items.forEach(it=>{ if(!it||!it.lpId||!it.msg)return; const arr=(EXTPEND[it.lpId]=EXTPEND[it.lpId]||[]); if(arr.some(x=>x.msg===it.msg))return; arr.push(it); n++; }); return n; }
function extPendingCount(){return Object.values(EXTPEND).reduce((s,a)=>s+a.length,0);}
function mergedPending(lp){ const seen=new Set(),out=[]; (lp.pending||[]).concat(EXTPEND[lp.id]||[]).forEach(p=>{ if(!p||!p.msg||seen.has(p.msg))return; seen.add(p.msg); out.push(p); }); return out; }
function livePending(lp){ const rej=new Set((lp.rejected||[]).map(r=>r.msg)); return mergedPending(lp).filter(p=>!(ingested.has(p.msg)||rej.has(p.msg)||p.dup||isFuture(p.date))); }
function findPending(lp,msg){ let i=(lp.pending||[]).findIndex(x=>x.msg===msg); if(i>=0)return{item:lp.pending[i],from:'native',i}; const a=EXTPEND[lp.id]||[]; let j=a.findIndex(x=>x.msg===msg); if(j>=0)return{item:a[j],from:'ext',i:j}; return null; }
function archLoadedCount(){return ARCHIVES.reduce((s,a)=>s+Object.values(a.byLp).reduce((x,arr)=>x+arr.length,0),0);}
function mergeArchive(obj,fname){
  if(!obj||obj.type!=="lp_crm_logs_archive"||!Array.isArray(obj.lps)){toast((fname||"파일")+" — 아카이브 형식이 아님 (건너뜀)");return false;}
  if(ARCHIVES.some(a=>a.range===obj.range)){toast("이미 열린 아카이브: "+obj.range);return false;}
  const byLp={};obj.lps.forEach(e=>{byLp[e.id]=(e.logs||[]);});
  ARCHIVES.push({range:obj.range||fname,byLp});
  return true;}
async function openArchives(){
  if(window.showOpenFilePicker){
    try{const hs=await window.showOpenFilePicker({multiple:true,types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      let n=0;for(const h of hs){const f=await h.getFile();try{if(mergeArchive(JSON.parse(await f.text()),f.name))n++;}catch(e){toast(f.name+" — JSON 파싱 실패");}}
      if(n){renderList();renderMain();toast("아카이브 "+n+"개 열림 · 과거 로그 "+archLoadedCount()+"건 표시");}
      return;}catch(e){if(e.name==="AbortError")return;}}
  document.getElementById("archimp").click();}
function importArchives(e){const files=[...e.target.files];if(!files.length)return;let n=0,done=0;
  files.forEach(f=>{const r=new FileReader();r.onload=()=>{try{if(mergeArchive(JSON.parse(r.result),f.name))n++;}catch(_){toast(f.name+" — JSON 파싱 실패");}
    if(++done===files.length&&n){renderList();renderMain();toast("아카이브 "+n+"개 열림 · 과거 로그 "+archLoadedCount()+"건 표시");}};r.readAsText(f);});e.target.value="";}

/* ===== 승인·반려 결정 기록 (lp_crm_decisions_<user>.json) — r28 =====
   아티팩트(Claude) 화면은 1MB가 넘는 본체(lp_crm_data.json)를 직접 저장할 수 없다(커넥터 상한 1MB).
   그래서 아티팩트에서 누른 승인·반려·복원은 사람별 작은 '결정 기록' 파일에 쌓아 두고,
   웹·아티팩트 모두 열 때 이 기록을 본체 위에 덧입혀 같은 화면을 보여준다.
   웹 대시보드는 덧입힌 결과를 본체에 저장한 뒤, 반영한 기록만 결정 파일에서 지운다. */
let DEC_LOADED=[]; // [{file:{name,driveId,id}, ops:[...]}] 이번에 읽어 온 결정 파일
function decUserKey(u){return String(u||'').toLowerCase().split('@')[0].replace(/[^a-z0-9._-]/g,'')||'guest';}
function decFileName(u){return 'lp_crm_decisions_'+decUserKey(u)+'.json';}
function decOpId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function applyOp(o){
  if(!o||!DATA)return false;
  if(o.op==='top'){ if(!o.key)return false; DATA[o.key]=JSON.parse(JSON.stringify(o.value)); return true; }
  if(o.op==='lpadd'){ if(!o.lp||!o.lp.id)return false; if(DATA.lps.some(l=>l.id===o.lp.id))return false;
    const nl=JSON.parse(JSON.stringify(o.lp)); nl.logs=nl.logs||[]; nl.pending=nl.pending||[]; nl.rejected=nl.rejected||[]; nl.contacts=nl.contacts||[]; nl.investments=nl.investments||[]; nl.relations=nl.relations||['lp']; nl.aliases=nl.aliases||[nl.name];
    DATA.lps.push(nl); nl.logs.forEach(l=>{if(l&&l.msg)ingested.add(l.msg);}); return true; }
  if(o.op==='lpdel'){ const n0=DATA.lps.length; DATA.lps=DATA.lps.filter(l=>l.id!==o.lpId); return DATA.lps.length!==n0; }
  if(!o.lpId||!o.msg)return false;
  const lp=DATA.lps.find(l=>l.id===o.lpId); if(!lp)return false;
  lp.pending=lp.pending||[]; lp.rejected=lp.rejected||[];
  if(o.op==='approve'){
    if(ingested.has(o.msg))return false;
    const p=o.item||{};
    lp.logs.unshift({date:p.date,rel:p.rel,source:p.source||'teams',txt:p.txt,by:(p.by||'')+' (승인)',status:'approved',url:p.url,msg:o.msg});
    lp.logs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    ingested.add(o.msg);
    lp.pending=lp.pending.filter(x=>x.msg!==o.msg); lp.rejected=lp.rejected.filter(x=>x.msg!==o.msg);
    return true;}
  if(o.op==='reject'){
    if(ingested.has(o.msg)||lp.rejected.some(x=>x.msg===o.msg))return false;
    const it=Object.assign({},o.item||{},{msg:o.msg,rejectedBy:o.by||''});
    lp.pending=lp.pending.filter(x=>x.msg!==o.msg); lp.rejected.unshift(it);
    return true;}
  if(o.op==='lpmeta'){ if(!o.meta)return false; const m=JSON.parse(JSON.stringify(o.meta)); delete m.id; delete m.logs; delete m.pending; delete m.rejected;
    Object.keys(lp).forEach(k=>{ if(!(k in m)&&!['id','logs','pending','rejected'].includes(k)) delete lp[k]; }); Object.assign(lp,m); return true; }
  if(o.op==='logset'){ const i=lp.logs.findIndex(x=>x.msg===o.msg); if(i<0||!o.log)return false; lp.logs[i]=Object.assign(JSON.parse(JSON.stringify(o.log)),{msg:o.msg}); lp.logs.sort((a,b)=>(b.date||'').localeCompare(a.date||'')); return true; }
  if(o.op==='logdel'){ const i=lp.logs.findIndex(x=>x.msg===o.msg); if(i<0)return false; lp.logs.splice(i,1); ingested.delete(o.msg); return true; }
  if(o.op==='restore'){
    const i=lp.rejected.findIndex(x=>x.msg===o.msg); if(i<0)return false;
    const it=lp.rejected.splice(i,1)[0]; delete it.rejectedBy;
    if(!lp.pending.some(x=>x.msg===o.msg))lp.pending.unshift(it);
    return true;}
  return false;}
/* 읽어 온 결정 파일들을 시간순으로 덧입힘. 반환: 실제로 바뀐 건수 */
function applyDecisions(){
  const all=[];DEC_LOADED.forEach(f=>(f.ops||[]).forEach(o=>all.push(o)));
  all.sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
  let n=0;all.forEach(o=>{try{if(applyOp(o))n++;}catch(_){}});return n;}
function parseDecFile(txt){try{const j=JSON.parse(txt);return (j&&Array.isArray(j.ops))?j.ops:[];}catch(_){return [];}}

/* ===== helpers ===== */
function isAdmin(u){return ((DATA&&DATA.admins)||[]).map(x=>x.toLowerCase()).includes((u||"").toLowerCase());}
function refreshWho(){document.getElementById("who").textContent="접속: "+currentUser+(isAdmin(currentUser)?" · 관리자":"");}
function fundClass(f){const x=(f||"").toLowerCase();return x.includes("red")?"red":x.includes("orange")?"orange":"grey";}
function fmtAmt(lp,a){if(!a)return "";return lp.region==="해외"?("USD "+a+"MM"):(a+"억");}
function autoTier(lp){if((lp.investments||[]).some(v=>String(v.amount||"").trim()!==""))lp.tier="기존";}
function num(a){const n=parseFloat(String(a==null?"":a).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function rnd(n){return Math.round(n*100)/100;}
function fmtSum(region,n){if(!n)return "";return region==="해외"?("USD "+rnd(n)+"MM"):(rnd(n)+"억");}
function lpSum(lp){return (lp.investments||[]).reduce((s,v)=>s+num(v.amount),0);}
function arkMap(cur){return (DATA.ark&&DATA.ark[cur])||{};}
function arkSum(cur){return (DATA.funds||[]).reduce((s,f)=>s+num(arkMap(cur)[f]),0);}
function curRegion(cur){return cur==="krw"?"국내":"해외";}
function colSumCur(f,cur){const reg=curRegion(cur);return DATA.lps.reduce((s,lp)=>{if(lp.region!==reg)return s;const iv=(lp.investments||[]).find(x=>x.fund===f);return s+num(iv&&iv.amount);},0)+num(arkMap(cur)[f]);}
function grandCur(cur){const reg=curRegion(cur);return DATA.lps.reduce((s,lp)=>lp.region===reg?s+lpSum(lp):s,0)+arkSum(cur);}
const FX=14; /* USD 1MM = 14억 (환율 1,400원 임의 적용) */
function krwEq(lp){return lp.region==="해외"?lpSum(lp)*FX:lpSum(lp);}
function tierTh(){const t=DATA.tierThresholds||{t1:300,t2:100};return t;}
function sizeTier(lp){const e=krwEq(lp),t=tierTh();return e>=t.t1?1:e>=t.t2?2:3;}
const TIER_LABEL={1:"Tier I",2:"Tier II",3:"Tier III"};
function tierDesc(n){const t=tierTh();return n===1?`누적 ${t.t1}억원 이상`:n===2?`누적 ${t.t2}–${t.t1}억원`:`누적 ${t.t2}억원 이하`;}

/* ===== ARK Fund Snapshot — 펀드별 LP 출자 현황 (관리자 표의 펀드 열 순서) ===== */
let snapFund=null, snapRegion="전체";
function snapEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function snapFmt(n,dec){return (Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:dec||0,maximumFractionDigits:2});}
function snapPct(a,b){return b?(a/b*100).toFixed(1)+"%":"—";}
function snapAmt(region,n){return region==="해외"?("USD "+snapFmt(n)+"MM"):(snapFmt(n)+"억");}
function snapRows(f,region){
  const rows=DATA.lps.filter(lp=>lp.region===region).map(lp=>{const iv=(lp.investments||[]).find(x=>x.fund===f);return {lp,amt:num(iv&&iv.amount)};}).filter(r=>r.amt>0).sort((a,b)=>b.amt-a.amt);
  const ark=num(arkMap(region==="해외"?"usd":"krw")[f]);
  return {rows,ark,sub:rows.reduce((s,r)=>s+r.amt,0)+ark};
}
function snapFundTotal(f){const d=snapRows(f,"국내"),o=snapRows(f,"해외");return {krw:d.sub,usd:o.sub,eq:d.sub+o.sub*FX,n:d.rows.length+o.rows.length};}
function openSnapshot(){viewMode="snapshot";if(!snapFund||!(DATA.funds||[]).includes(snapFund))snapFund=(DATA.funds||[])[0]||null;const tb=document.getElementById("tblBtn");if(tb)tb.classList.remove("on");renderList();renderMain();try{document.getElementById("main").scrollTop=0;}catch(_){}}
function setSnapFund(i){snapFund=(DATA.funds||[])[i];renderMain();}
function setSnapRegion(r){snapRegion=r;renderMain();}
function goLP(id){activeId=id;viewMode="detail";renderList();renderMain();}
function snapSection(f,region,grandEq){
  const d=snapRows(f,region), cur=region==="해외"?"USD MM":"억";
  const body=d.rows.map((r,i)=>`<tr><td class="no">${i+1}</td><td><a class="lplink" onclick="goLP('${r.lp.id}')">${snapEsc(r.lp.name)}</a>${r.lp.hidden?'<span class="hidetag">숨김</span>':""}</td><td><span class="tierbadge ${snapEsc(r.lp.tier)}">${snapEsc(r.lp.tier)}</span></td><td class="r">${snapAmt(region,r.amt)}</td><td class="r">${snapPct(r.amt,d.sub)}</td></tr>`).join("");
  const arkRow=d.ark?`<tr class="ark"><td class="no">GP</td><td><b>ARK &amp; Partners</b> <span class="cur">GP 출자</span></td><td></td><td class="r">${snapAmt(region,d.ark)}</td><td class="r">${snapPct(d.ark,d.sub)}</td></tr>`:"";
  const empty=(!d.rows.length&&!d.ark)?`<tr><td colspan="5" class="empty" style="padding:12px">${region} LP 출자 없음</td></tr>`:"";
  return `<tr class="sechdr"><td colspan="5">${region} <span class="cur">· ${cur}</span></td></tr>${body}${arkRow}${empty}
    <tr class="sub"><td></td><td>${region} 소계 <span class="cur">${d.rows.length}개 LP${d.ark?" + GP":""}</span></td><td></td><td class="r">${snapAmt(region,d.sub)}</td><td class="r">${d.sub?"100.0%":"—"}</td></tr>`;
}
function renderSnapshot(){
  const funds=DATA.funds||[];
  if(!funds.length){document.getElementById("main").innerHTML=`<div class="empty">관리자 표에 펀드 열이 없습니다.</div>`;return;}
  if(!snapFund||!funds.includes(snapFund))snapFund=funds[0];
  const fbtns=funds.map((f,i)=>{const t=snapFundTotal(f);return `<button class="fbtn ${fundClass(f)} ${f===snapFund?"on":""}" onclick="setSnapFund(${i})"><span class="fn">${snapEsc(f)}</span><span class="fa">${[t.krw?snapFmt(t.krw)+"억":"",t.usd?"USD "+snapFmt(t.usd)+"MM":""].filter(Boolean).join(" · ")||"—"}</span><span class="fc">${t.n}개 LP</span></button>`;}).join("");
  const T=snapFundTotal(snapFund);
  const regs=["전체","국내","해외"].map(r=>`<button class="${snapRegion===r?"on":""}" onclick="setSnapRegion('${r}')">${r}</button>`).join("");
  const showD=snapRegion!=="해외", showO=snapRegion!=="국내";

      <td><select onchange="setLP('${lp.id}','tier',this.value)"><option ${lp.tier==="기존"?"selected":""}>기존</option><option ${lp.tier==="신규"?"selected":""}>신규</option></select></td>
      <td class="totcol" id="tot-${lp.id}">${fmtSum(lp.region,lpSum(lp))}</td>${fcells}</tr>`;}).join("");

    return `<tr class="tot"><td>${label}</td><td></td><td></td><td></td><td class="totcol" id="grand-${cur}">${rnd(grandCur(cur))||""}</td>${cells}</tr>`;};

function setLP(id,k,v){const lp=DATA.lps.find(l=>l.id===id);lp[k]=v;if(k==="region")renderTable();renderList();}
function setAmt(id,fund,v){const lp=DATA.lps.find(l=>l.id===id);lp.investments=lp.investments||[];let inv=lp.investments.find(x=>x.fund===fund);v=v.trim();
  if(!inv){if(v)lp.investments.push({fund,amount:v});}else{if(v)inv.amount=v;else lp.investments=lp.investments.filter(x=>x.fund!==fund);}
  autoTier(lp);updateTotals();renderList();}
function setArk(cur,fund,v){DATA.ark=DATA.ark||{};DATA.ark[cur]=DATA.ark[cur]||{};v=v.trim();if(v)DATA.ark[cur][fund]=v;else delete DATA.ark[cur][fund];updateTotals();}
function updateTotals(){if(viewMode!=="table"||!DATA)return;
  DATA.lps.forEach(lp=>{const c=document.getElementById('tot-'+lp.id);if(c)c.textContent=fmtSum(lp.region,lpSum(lp));});
  ["krw","usd"].forEach(cur=>{const ac=document.getElementById('tot-ark-'+cur);if(ac)ac.textContent=fmtSum(curRegion(cur),arkSum(cur));
    (DATA.funds||[]).forEach((f,i)=>{const c=document.getElementById('csum-'+cur+'-'+i);if(c)c.textContent=rnd(colSumCur(f,cur))||"";});
    const g=document.getElementById('grand-'+cur);if(g)g.textContent=rnd(grandCur(cur))||"";});}
function addFund(){modal(`<h4>펀드 열 추가</h4><label>펀드 이름</label><input id="nf" placeholder="예: Rubicon II"><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAddFund()">추가</button></div>`);}
function doAddFund(){const n=document.getElementById("nf").value.trim();if(!n){toast("이름 입력");return;}DATA.funds=DATA.funds||[];if(!DATA.funds.includes(n))DATA.funds.push(n);closeModal();renderTable();toast("펀드 추가됨");}
function delFund(f){const used=DATA.lps.filter(l=>(l.investments||[]).some(i=>i.fund===f&&String(i.amount||"").trim()!=="")).map(l=>l.name);const warn=used.length?`\n\n주의: ${used.join(", ")}에 금액이 입력돼 있고, 함께 삭제됩니다.`:"";askConfirm(`펀드 열 '${f}'을(를) 삭제할까요?${warn}`,function(){DATA.funds=(DATA.funds||[]).filter(x=>x!==f);DATA.lps.forEach(lp=>{lp.investments=(lp.investments||[]).filter(i=>i.fund!==f);});renderTable();renderList();toast("펀드 열 삭제됨");});}

/* ===== toast / modal ===== */
function toast(t,undoFn){const el=document.getElementById("toast");el.innerHTML="";el.appendChild(document.createTextNode(t));
  if(undoFn){const u=document.createElement("span");u.className="undo";u.textContent="실행취소";u.onclick=()=>{el.classList.remove("show");undoFn();};el.appendChild(u);}
  el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),undoFn?5000:1800);}
function modal(html){document.getElementById("modal").innerHTML=html;document.getElementById("ov").classList.add("show");}
function askConfirm(msg,fn){window.__askFn=fn;modal(`<h4>확인</h4><div style="white-space:pre-wrap;font-size:13.5px">${String(msg).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="closeModal();var f=window.__askFn;window.__askFn=null;if(f)f();">확인</button></div>`);}
function closeModal(){document.getElementById("ov").classList.remove("show");}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});

/* ===== approve / reject / undo ===== */
function approve(id,msg){const lp=DATA.lps.find(l=>l.id===id);const f=findPending(lp,msg);if(!f){toast("항목을 찾을 수 없습니다");return;}const p=f.item;if(ingested.has(p.msg)){toast("이미 등록됨 (중복)");if(f.from==='ext')EXTPEND[lp.id].splice(f.i,1);renderMain();return;}
  lp.logs.unshift({date:p.date,rel:p.rel,source:p.source||"teams",txt:p.txt,by:(p.by||'')+" (승인)",status:"approved",url:p.url,msg:p.msg});
  lp.logs.sort((a,b)=>b.date.localeCompare(a.date));ingested.add(p.msg);
  if(f.from==='native')lp.pending.splice(f.i,1); else EXTPEND[lp.id].splice(f.i,1);
  renderList();renderMain();toast("승인됨 · 저장 중…");autosave();}
function reject(id,msg){const lp=DATA.lps.find(l=>l.id===id);const f=findPending(lp,msg);if(!f){toast("항목을 찾을 수 없습니다");return;}const item=f.item;lp.rejected=lp.rejected||[];item.rejectedBy=currentUser;
  if(f.from==='native')lp.pending.splice(f.i,1); else EXTPEND[lp.id].splice(f.i,1);
  lp.rejected.unshift(item);renderList();renderMain();toast("반려됨 · 반려함으로 이동 · 저장 중…");autosave();}
function restoreRejected(id,msg){const lp=DATA.lps.find(l=>l.id===id);const idx=(lp.rejected||[]).findIndex(x=>x.msg===msg);if(idx<0)return;const item=lp.rejected[idx];delete item.rejectedBy;lp.rejected.splice(idx,1);lp.pending.unshift(item);renderList();renderMain();toast("복원됨 · 승인 대기로 · 저장 중…");autosave();}
function delLog(id,msg){const lp=DATA.lps.find(l=>l.id===id);const idx=lp.logs.findIndex(l=>l.msg===msg);if(idx<0)return;lastDelLog={id,item:lp.logs[idx]};lp.logs.splice(idx,1);ingested.delete(msg);renderList();renderMain();toast("로그 삭제됨",undoDelLog);}
function undoDelLog(){if(!lastDelLog)return;const lp=DATA.lps.find(l=>l.id===lastDelLog.id);if(lp){lp.logs.push(lastDelLog.item);lp.logs.sort((a,b)=>b.date.localeCompare(a.date));ingested.add(lastDelLog.item.msg);}lastDelLog=null;renderList();renderMain();toast("복구됨");}
/* 관리자: 승인된 메시지의 표시 텍스트·날짜만 수정 — 원 소스링크(url)·유일ID(msg)·수집자(by)·소스는 보존 */
function editLog(id,msg){if(!isAdmin(currentUser)){toast("관리자만 수정할 수 있습니다");return;}const lp=DATA.lps.find(l=>l.id===id);if(!lp)return;const l=lp.logs.find(x=>x.msg===msg);if(!l){toast("아카이브된 로그는 아카이브를 열고 수정하세요");return;}
  const ea=s=>(s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;');const qa=s=>(s||"").replace(/"/g,'&quot;');
  modal(`<h4>메시지 수정 <span style="font-weight:400;color:var(--muted);font-size:12px">· 원 소스링크·ID는 그대로 유지됩니다</span></h4>
    <label>날짜</label><input type="date" id="el_date" value="${qa((l.date||'').slice(0,10))}">
    <label>표시 메시지</label><textarea id="el_txt" rows="4" style="width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;resize:vertical">${ea(l.txt)}</textarea>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">원문: ${l.url?`<a href="${qa(l.url)}" target="_blank">원문 열기 ›</a>`:'링크 없음'} · ID <code style="font-size:11px">${qa(msg)}</code></div>
    <div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doEditLog('${id}','${msg}')">저장</button></div>`);}
function doEditLog(id,msg){const lp=DATA.lps.find(l=>l.id===id);if(!lp)return;const l=lp.logs.find(x=>x.msg===msg);if(!l)return;const t=document.getElementById("el_txt").value.trim();if(!t){toast("메시지 내용을 입력하세요");return;}l.txt=t;const d=document.getElementById("el_date").value.trim();if(d)l.date=d;l.edited=true;l.editedBy=currentUser||l.editedBy;lp.logs.sort((a,b)=>b.date.localeCompare(a.date));closeModal();renderList();renderMain();toast("메시지 수정됨 · 저장 중…");autosave();}

let mView='crm', mQ='', mRegion='전체', mOpen=new Set();
function mEsc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const mSRC={teams:'Teams',email:'Mail',calendar:'Cal'};
function mAmt(v){var n=parseFloat(String((v&&v.amount)||'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function mTot(lp){return (lp.investments||[]).reduce((a,v)=>a+mAmt(v),0);}
function mLogs(lp){return (lp.logs||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function mLast(lp){var L=mLogs(lp).filter(x=>(''+(x.date||'')).slice(0,10)<=todayStr());return L.length?L[0].date:null;}
function mDays(d){return Math.round((new Date(todayStr())-new Date(d))/864e5);}
function mAgo(d){if(!d)return'기록 없음';var n=mDays(d);if(n<=1)return'어제';if(n<7)return n+'일 전';if(n<60)return Math.floor(n/7)+'주 전';return Math.floor(n/30)+'개월 전';}
function mRenderCrm(){
  var q=mQ.trim().toLowerCase();
  var rows=DATA.lps.filter(function(lp){
    if(lp.hidden)return false;
    if(!(mRegion==='전체'||lp.region===mRegion))return false;
    if(!q)return true;
    var hay=((lp.name||'')+' '+(lp.short||'')+' '+(lp.aliases||[]).join(' ')+' '+(lp.contacts||[]).map(c=>c.n).join(' ')).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  rows.sort(function(a,b){return (typeof krwEq==='function'?krwEq(b)-krwEq(a):mTot(b)-mTot(a));}); // PC 사이드바와 동일 순서
  function mCard(lp){
    var cur=(lp.contacts&&lp.contacts.length)?lp.contacts.map(c=>mEsc(c.n)+(c.r?' '+mEsc(c.r):'')).join(' · '):'등록된 담당자 없음';
    var invTxt=(lp.investments||[]).map(i=>mEsc(i.fund)+(i.amount?' '+mEsc(i.amount):'')).join(' / ');
    var pn=livePending(lp).length, L=mLogs(lp);
    var sz=(typeof fmtSum==='function'&&typeof lpSum==='function')?fmtSum(lp.region,lpSum(lp)):'';
    var logs=L.map((x,i)=>'<li'+(i>=4?' data-x="1" style="display:none"':'')+'><span class="ld">'+mEsc(x.date)+'<span class="msrc">'+(mSRC[x.source||'teams']||'')+'</span></span>'+mEsc(x.txt)+'</li>').join('');
    var open=mOpen.has(lp.id);
    return '<div class="mcard'+(open?' open':'')+'"><div class="chead" data-id="'+mEsc(lp.id)+'"><div class="nm"><strong>'+mEsc(lp.name)+'</strong>'+
      '<div class="sub">'+(lp.region==='해외'?'<span class="mtag t-ovs">해외</span>':'')+(sz?'누적 '+mEsc(sz):'')+'</div>'+
      '<div class="sub" style="margin-top:3px">'+invTxt+(pn?'<span class="mbadge">대기 '+pn+'</span>':'')+'</div></div>'+
      '<div class="rt"><span style="font-size:18px;color:#c7c7cc">›</span></div></div>'+
      '<div class="cbody"><div class="mrow"><b>담당자</b> · '+cur+'</div>'+
      (function(){var pv=livePending(lp);if(!pv.length)return '';return '<div class="msec">승인 대기 '+pv.length+'</div>'+pv.map(function(p){var key=mEsc(lp.id)+'|'+encodeURIComponent(p.msg);return '<div class="mpend"><span class="ld" style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">'+mEsc(p.date)+'<span class="msrc">'+(mSRC[p.source||'teams']||'')+'</span></span>'+mEsc(p.txt)+(p.url?' <a href="'+mEsc(p.url)+'" target="_blank" style="font-size:11px">원문 ›</a>':'')+'<div class="pbtns"><button class="b-appr" data-act="'+key+'">승인</button><button class="b-rej" data-rej="'+key+'">반려</button></div></div>';}).join('');})()+
      '<div class="msec">로그</div>'+
      (L.length?'<ul class="mlogs">'+logs+'</ul>'+(L.length>4?'<button class="more">이력 전체 보기 ('+L.length+'건)</button>':''):'<div class="mempty">승인된 로그가 없습니다.</div>')+
      ((lp.rejected&&lp.rejected.length)?'<div class="msec">반려 히스토리 '+lp.rejected.length+'</div>'+lp.rejected.map(function(p){return '<div class="mrej"><span class="ld" style="font-size:11px;color:var(--muted);display:block">'+mEsc(p.date)+' · 반려 '+mEsc(p.rejectedBy||p.by||'')+'</span>'+mEsc(p.txt)+'</div>';}).join(''):'')+
      '</div></div>';
  }
  var groups={1:[],2:[],3:[]};
  rows.forEach(function(lp){var t=(typeof sizeTier==='function')?sizeTier(lp):3; (groups[t]=groups[t]||[]).push(lp);});
  var html='';
  [1,2,3].forEach(function(t){var arr=groups[t]||[];if(!arr.length)return;
    var label=(typeof TIER_LABEL!=='undefined'&&TIER_LABEL[t])?TIER_LABEL[t]:('Tier '+t);
    var desc=(typeof tierDesc==='function')?tierDesc(t):'';
    html+='<div class="mtierhdr"><span class="tl">'+mEsc(label)+'</span>'+(desc?'<span class="tdd">'+mEsc(desc)+'</span>':'')+'</div>'+arr.map(mCard).join('');
  });
  document.getElementById('m-list').innerHTML=html||'<div class="mempty" style="padding:20px 4px">표시할 LP가 없습니다.</div>';
}
function mRenderFunds(){
  var funds=DATA.funds||[];
  document.getElementById('m-funds').innerHTML=funds.map(function(f){
    var dom=DATA.lps.filter(l=>(l.investments||[]).some(i=>i.fund===f&&String(i.amount||'').trim()!==''));
    if(!dom.length)return '';
    var amt=l=>mAmt((l.investments||[]).find(i=>i.fund===f));
    var sum=dom.reduce((a,l)=>a+amt(l),0);
    var rows=dom.slice().sort((a,b)=>amt(b)-amt(a)).map(function(l){var w=Math.round(amt(l)/Math.max(sum,1)*100);return '<tr><td>'+mEsc(l.short||l.name)+(l.region==='해외'?' <span class="mtag t-ovs">해외</span>':'')+'<div class="bar"><i style="width:'+Math.min(w,100)+'%"></i></div></td><td class="r">'+Math.round(amt(l))+'</td></tr>';}).join('');
    return '<h2>'+mEsc(f)+'</h2><div class="tblwrap"><table><tr><th>LP ('+dom.length+')</th><th class="r">약정</th></tr>'+rows+'<tr><td><b>합계</b></td><td class="r"><b>'+Math.round(sum)+'</b></td></tr></table></div>';
  }).join('')||'<div class="mempty">데이터 없음</div>';
}
function mRenderPending(){

    try{ const r=await A_MCP.callTool(A_CFG.server,tool,args); return r; }catch(e){ first=e; } // 결과 전체를 넘김(내용 블록이 여러 개일 수 있음)
  }
  if(typeof A_MCP.server==='function'){
    try{ const s=await A_MCP.server(A_CFG.server); if(s&&typeof s[tool]==='function') return await s[tool](args); }catch(e){ if(!first)first=e; }
  }
  throw first||new Error('커넥터 호출 실패: '+tool);
}
function aErrMsg(e){return (e&&(e.message||e.code))||String(e);}
/* 폴더 목록: "이름 (file, N bytes) file:///drive/item" 이 이어붙은 텍스트 */
async function aListFolder(){
  const raw=await aCall('read_resource',{uri:A_CFG.folderUri});
  const out={};
  aWalkFiles(raw,out,0);
  const t=aText(raw);
  try{ A_LASTRAW='['+(raw&&typeof raw==='object'?Object.keys(raw).join(','):typeof raw)+'] '+(typeof raw==='string'?raw:JSON.stringify(raw)).slice(0,600); }catch(_){ A_LASTRAW=String(t).slice(0,400); }
  // 텍스트형: "이름 (file, N bytes) file:///drive/item" (줄바꿈 유무 무관)
  const re=/\s*([^\n\r]+?) \((file|folder)(?:, ([\d,]+) bytes)?\)\s*(file:\/\/\/([^\/\s]+)\/([0-9A-Z]{34}))/g;
  let m;
  while((m=re.exec(t))){ var nm=m[1].replace(/^[\s\-\*•]+/,'').trim(); if(!out[nm])out[nm]={name:nm,kind:m[2],size:m[3]?+m[3].replace(/,/g,''):null,uri:m[4],driveId:m[5],id:m[6]}; }
  // 이름만 확실히 맞추는 보조 탐색: 알려진 파일명 뒤의 file:/// 주소
  ['lp_crm_data.json','lp_crm_index.json'].forEach(function(nm){
    if(out[nm])return; var i=t.indexOf(nm); if(i<0)return;
    var mm=t.slice(i).match(/file:\/\/\/([^\/\s]+)\/([0-9A-Z]{34})/); var sz=t.slice(i).match(/([\d,]+) bytes/);
    if(mm)out[nm]={name:nm,kind:'file',size:sz?+sz[1].replace(/,/g,''):null,uri:mm[0],driveId:mm[1],id:mm[2]};
  });
  return out;
}
/* 큰 텍스트 파일을 쪽 단위로 끝까지 읽어 이어 붙임 */
async function aReadText(uri){
  let page=1,parts=[],guard=0;
  while(guard++<80){
    const t=aText(await aCall('read_resource',page===1?{uri:uri}:{uri:uri,startPage:page}));
    const m=t.match(/re-call with startPage=(\d+)/);
    parts.push(t.replace(/\s*\[(?:page|truncated)[^\[\]]*\]\s*$/,''));
    if(m){ const n=+m[1]; if(!(n>page))break; page=n; } else break;
  }
  return parts.join('\n');
}
async function aReadJson(uri){const t=await aReadText(uri);return JSON.parse(t);}
async function aWriteFile(name,content){
  const f=A_FILES[name];
  if(f) return aCall('sharepoint_update_file',{driveId:f.driveId,itemId:f.id,content:content});
  const parts=A_CFG.folderUri.replace('file:///','').split('/');
  const r=await aCall('sharepoint_upload_file',{driveId:parts[0],parentItemId:parts[1],filename:name,content:content,conflictBehavior:'replace'});
  return r;
}
function aShowAuth(html){var b=document.querySelector('#auth .authbox'); if(b)b.innerHTML=html;}
function aAuthScreen(){
  document.getElementById('auth').style.display='flex'; document.body.classList.add('locked');
  aShowAuth('<div class="authtitle">ARK LP CRM</div><div class="authsub">Microsoft 365 연결로 데이터를 불러옵니다</div>'+
    '<div id="authstat" class="authstat">연결 확인 중…</div>'+
    '<div id="a_btns" style="display:none;margin-top:16px;gap:8px;flex-direction:column"><button class="msbtn" onclick="aBoot()">다시 시도</button><button class="msbtn" onclick="aPerm()">권한 설정 열기</button></div>'+
    '<div id="a_diag" style="display:none;margin-top:12px;font-size:10.5px;color:#6e6e73;text-align:left;word-break:break-all;max-height:120px;overflow:auto;user-select:text"></div>'+
    '<div id="buildtag" style="font-size:10px;color:#c7c7cc;margin-top:12px">build sso-r30 · artifact</div>');
}
function aFail(msg){aStat(msg,true); var b=document.getElementById('a_btns'); if(b)b.style.display='flex'; var d=document.getElementById('a_diag'); if(d&&A_LASTRAW){d.textContent='진단: '+A_LASTRAW; d.style.display='block';}}
async function aPerm(){try{const p=await window.claude.use('permissions'); if(p&&p.manage) await p.manage();}catch(_){toast('아티팩트 상단 메뉴의 권한 설정에서 Microsoft 365를 허용해 주세요');}}
async function aLoad(){
  if(A_BUSY)return; A_BUSY=true;
  try{
    aStat('폴더 확인 중…');
    A_FILES=await aListFolder();
    const df=A_FILES[A_CFG.dataName];
    if(!df)throw new Error('LP_CRM 폴더에서 '+A_CFG.dataName+'을 찾지 못했습니다 (목록에서 읽은 파일 '+Object.keys(A_FILES).length+'개)');
    aStat('데이터 불러오는 중… (큰 파일이라 10~30초 걸릴 수 있습니다)');
    const txt=await aReadText(df.uri);
    DATA=JSON.parse(txt); normalize(); A_DATASIZE=df.size;
    LOADED_LP=(DATA.lps||[]).length; LOADED_BYTES=txt.length;
    if((DATA.appVersion||0)>APP_VERSION){ document.getElementById('auth').style.display='none'; document.body.classList.remove('locked'); showUpdateBlock('새 버전이 필요합니다','데이터가 더 새로운 대시보드 버전으로 저장됐습니다. Claude에게 아티팩트 갱신을 요청해 주세요.'); return; }
    rebuildLedger();
    if(!A_ME){ try{ const me=JSON.parse(aText(await aCall('get_me',{}))); A_ME=me.mail||me.userPrincipalName||me.displayName||null; }catch(_){} }
    currentUser=A_ME||'게스트';
    /* 결정 파일 덧입히기 */
    DEC_LOADED=[];
    for(const nm of Object.keys(A_FILES)){ if(!/^lp_crm_decisions_.*\.json$/i.test(nm))continue;
      try{ const ops=parseDecFile(await aReadText(A_FILES[nm].uri)); if(ops.length)DEC_LOADED.push({file:A_FILES[nm],ops:ops}); }catch(_){} }
    applyDecisions();
    try{(CONFIG.adminEmails||[]).forEach(function(e){if(DATA.admins&&!DATA.admins.map(function(x){return String(x).toLowerCase();}).includes(e.toLowerCase()))DATA.admins.push(e);});}catch(_){}
    A_BASE=aSnap();
    if(!DATA.lps.find(l=>l.id===activeId))activeId=DATA.lps[0]&&DATA.lps[0].id;
    document.getElementById('auth').style.display='none'; document.body.classList.remove('locked');
    var ub=document.getElementById('updblock'); if(ub)ub.remove();
    refreshWho(); renderTabs(); renderSort(); renderList(); renderMain();
    /* 개인 수집 후보 + 아카이브 */
    EXTPEND={};
    for(const nm of Object.keys(A_FILES)){ if(!/^lp_crm_pending_.*\.json$/i.test(nm))continue;
      try{ mergeExtPending(await aReadJson(A_FILES[nm].uri)); }catch(_){} }
    renderList(); renderMain();
    ARCHIVES=[];
    for(const nm of (DATA.archiveFiles||[])){ const f=A_FILES[nm]; if(!f)continue; try{ mergeArchive(await aReadJson(f.uri),nm); }catch(_){} }
    renderList(); renderMain();
    toast('불러옴 · 승인대기 '+DATA.lps.reduce((s,l)=>s+livePending(l).length,0)+'건');
  }catch(e){
    const msg=aErrMsg(e);
    if(document.getElementById('auth').style.display!=='none') aFail('불러오기 실패: '+msg+' — Microsoft 365 커넥터가 연결·허용돼 있는지 확인해 주세요.');
    else toast('불러오기 실패: '+msg);
  }finally{ A_BUSY=false; }
}

/* ===== 관리자 편집 기록: 불러온 직후 상태(A_BASE)와 지금을 비교해 바뀐 부분만 결정 파일에 적는다 ===== */
let A_BASE=null;
const A_TOPKEYS=['funds','ark','tierThresholds','admins'];
const A_LPSKIP={logs:1,pending:1,rejected:1};
function aMeta(lp){const m={};Object.keys(lp).forEach(function(k){if(!A_LPSKIP[k])m[k]=lp[k];});return m;}
function aSnap(){
  const b={lps:{},order:[],top:{}};
  (DATA.lps||[]).forEach(function(lp){const logs={};(lp.logs||[]).forEach(function(l){if(l&&l.msg)logs[l.msg]=JSON.stringify(l);});b.lps[lp.id]={meta:JSON.stringify(aMeta(lp)),logs:logs};b.order.push(lp.id);});
  A_TOPKEYS.forEach(function(k){b.top[k]=JSON.stringify(DATA[k]===undefined?null:DATA[k]);});
  return b;}
function aDiffQueue(){
  if(!A_BASE||!DATA)return 0;
  let n=0; const cur={};
  (DATA.lps||[]).forEach(function(lp){
    cur[lp.id]=1; const base=A_BASE.lps[lp.id];
    if(!base){ aQueue({op:'lpadd',lpId:lp.id,msg:'lp:'+lp.id,lp:JSON.parse(JSON.stringify(Object.assign({},lp,{pending:[],rejected:[]})))}); n++; return; }
    const mj=JSON.stringify(aMeta(lp));
    if(mj!==base.meta){ aQueue({op:'lpmeta',lpId:lp.id,msg:'meta:'+lp.id,meta:JSON.parse(mj)}); n++; }
    const now={};
    (lp.logs||[]).forEach(function(l){ if(!l||!l.msg)return; now[l.msg]=1; const bj=base.logs[l.msg]; if(bj!==undefined){ const lj=JSON.stringify(l); if(lj!==bj){ aQueue({op:'logset',lpId:lp.id,msg:l.msg,log:JSON.parse(lj)}); n++; } } });
    Object.keys(base.logs).forEach(function(m){ if(!now[m]){ aQueue({op:'logdel',lpId:lp.id,msg:m}); n++; } });
  });
  Object.keys(A_BASE.lps).forEach(function(id){ if(!cur[id]){ aQueue({op:'lpdel',lpId:id,msg:'del:'+id}); n++; } });
  A_TOPKEYS.forEach(function(k){ const j=JSON.stringify(DATA[k]===undefined?null:DATA[k]); if(j!==A_BASE.top[k]){ aQueue({op:'top',lpId:'_top',msg:'top:'+k,key:k,value:JSON.parse(j)}); n++; } });
  A_BASE=aSnap();
  return n;}
function aTyping(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!document.getElementById('ov').classList.contains('show')&&a.closest&&a.closest('main'));}
/* 승인·반려·복원 → 결정 파일에 기록 */
function aQueue(op){op.id=decOpId(); op.at=new Date().toISOString(); op.by=currentUser; A_DECQ.push(op);}
async function aFlush(){
  try{aDiffQueue();}catch(_){}
  if(A_FLUSHING||!A_DECQ.length)return; A_FLUSHING=true;
  const batch=A_DECQ.splice(0,A_DECQ.length);
  const name=decFileName(currentUser);
  try{
    try{ A_FILES=await aListFolder(); }catch(_){}
    let j={type:'lp_crm_decisions',user:currentUser,ops:[]};
    if(A_FILES[name]){ try{ const t=await aReadText(A_FILES[name].uri); const o=JSON.parse(t); if(o&&Array.isArray(o.ops))j=o; }catch(_){} }
    const have=new Set(j.ops.map(o=>o&&o.id)); batch.forEach(o=>{if(!have.has(o.id))j.ops.push(o);});
    j.type='lp_crm_decisions'; j.user=currentUser; j.updatedAt=new Date().toISOString();
    await aWriteFile(name,JSON.stringify(j,null,1));
    try{ A_FILES=await aListFolder(); }catch(_){}
    toast('저장됨 · 변경 '+batch.length+'건 기록');
    try{ await aWriteIndex(); }catch(_){}
  }catch(e){
    A_DECQ=batch.concat(A_DECQ);
    toast('저장 실패('+aErrMsg(e)+') · 잠시 후 다시 시도합니다');
    setTimeout(aFlush,15000);
  }finally{ A_FLUSHING=false; if(A_DECQ.length)setTimeout(aFlush,500); }
}
async function aWriteIndex(){
  var days=400, idx=buildIndex(days,A_DATASIZE||0), txt=JSON.stringify(idx,null,1);
  while(txt.length>180000&&days>60){days=Math.floor(days/2); idx=buildIndex(days,A_DATASIZE||0); txt=JSON.stringify(idx,null,1);}
  await aWriteFile(INDEX_FILE,txt);
}
async function aExport(){
  try{ const dl=await window.claude.use('downloads'); if(dl&&dl.save){ await dl.save({filename:'lp_crm_data.json',data:JSON.stringify(DATA,null,2)}); return; } }catch(e){ toast('내려받기 취소·실패'); return; }
  toast('이 화면에서는 내려받기를 지원하지 않습니다');
}
function aReadonly(){toast('로그 아카이브는 웹 대시보드에서 실행해 주세요');}
async function aBoot(){
  aAuthScreen();
  try{ A_MCP=await window.claude.use('mcp'); }catch(_){ A_MCP=null; }
  if(!A_MCP){ aFail('Microsoft 365 커넥터를 쓸 수 없습니다. claude.ai 설정 → 커넥터에서 Microsoft 365를 연결한 뒤 이 화면을 다시 열어 주세요.'); return; }
  await aLoad();
}
function aInstall(){
  document.body.classList.add('artifact');
  /* 로그 아카이브(드물고 큰 작업)만 웹 전용. 나머지 관리자 편집은 결정 파일로 기록 */
  document.querySelectorAll('header.top [onclick="archiveOldLogs()"]').forEach(function(b){b.style.display='none';});
  switchUser=function(){toast('접속: '+currentUser+' (Microsoft 365 계정 기준)');};
  /* 승인·반려·복원: 화면 반영은 기존 로직 그대로, 저장만 결정 파일로 */
  const _approve=approve,_reject=reject,_restore=restoreRejected;
  approve=function(id,msg){const lp=DATA.lps.find(l=>l.id===id); const f=lp&&findPending(lp,msg); if(!f){toast('항목을 찾을 수 없습니다');return;}
    if(!ingested.has(msg)) aQueue({op:'approve',lpId:id,msg:msg,item:JSON.parse(JSON.stringify(f.item))}); _approve(id,msg);};
  reject=function(id,msg){const lp=DATA.lps.find(l=>l.id===id); const f=lp&&findPending(lp,msg); if(!f){toast('항목을 찾을 수 없습니다');return;}
    const it=JSON.parse(JSON.stringify(f.item)); delete it.rejectedBy; aQueue({op:'reject',lpId:id,msg:msg,item:it}); _reject(id,msg);};
  restoreRejected=function(id,msg){aQueue({op:'restore',lpId:id,msg:msg}); _restore(id,msg);};
  saveData=async function(){ await aFlush(); };
  openData=async function(){ await aLoad(); };
  openArchives=async function(){ if(ARCHIVES.length){toast('아카이브 '+ARCHIVES.length+'개 표시 중');return;} await aLoad(); };
  exportJSON=function(){ aExport(); };
  archiveOldLogs=aReadonly; uploadArchive=async function(){aReadonly();};
  appReload=async function(){ try{ await aFlush(); }catch(_){} var ub=document.getElementById('updblock'); if(ub)ub.remove(); aLoad(); };
  /* 저장 버튼을 안 눌러도: 4초마다 바뀐 부분이 있으면 기록(입력 중엔 기다림), 화면을 떠날 때도 기록 */
  setInterval(function(){ if(!DATA||A_BUSY||A_FLUSHING||aTyping())return; try{ if(aDiffQueue()) aFlush(); }catch(_){} },4000);
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&DATA&&!A_BUSY){ try{ aDiffQueue(); aFlush(); }catch(_){} } });
  /* 3분마다 본체 크기 변화 확인 → 바뀌었으면 새로 불러오기 안내 */
  setInterval(async function(){
    if(!DATA||A_BUSY||A_FLUSHING||document.getElementById('updblock')||document.hidden)return;
    try{ const fl=await aListFolder(); const d=fl[A_CFG.dataName]; if(d&&A_DATASIZE!=null&&d.size!==A_DATASIZE){ A_FILES=fl; showUpdateBlock('업데이트가 있습니다','다른 사람이 데이터를 갱신했습니다. 새로 불러와 주세요.'); } }catch(_){}
  },180000);
  aBoot();
}

const IS_ARTIFACT=(function(){try{return !!(window.claude&&typeof window.claude.use==='function')||/claudeusercontent|claude\.ai$|claude\.site$/i.test(location.hostname);}catch(e){return false;}})();
if(IS_ARTIFACT){ aInstall(); } else { boot(); }
/* 90초마다 파일 변경(cTag) 감지 → 다른 사용자/수집이 갱신했으면 새로고침 안내(내 저장은 If-Match로 이미 보호됨) */
if(!IS_ARTIFACT)setInterval(async function(){
  if(!gItem||document.getElementById('updblock'))return;
  try{ await refreshToken();
    const j=await (await graph('/drives/'+gItem.driveId+'/items/'+gItem.id+'?$select=eTag,cTag')).json();
    if(gCTag && j.cTag && j.cTag!==gCTag){ showUpdateBlock('업데이트가 있습니다','데이터가 갱신되었습니다. 새로고침 후 사용해 주세요.'); }
  }catch(_){}
}, 90000);
try{var _bt=document.getElementById('buildtag'); if(_bt) _bt.textContent+=' · js OK';}catch(_e){}
