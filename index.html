<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK LP CRM — POC</title>
<style>
  /* 예전 레이아웃/틀구조 유지 + HIG의 박스모양·그림자·색만 적용 */
  :root{
    --navy:#0f2440; --navy2:#1b3a63;
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd;
    --ink:#1d1d1f; --ink-2:#6e6e73; --muted:#8e8e93;
    --line:#e5e5ea; --line-2:#d2d2d7;
    --blue:#0071e3; --blue-tint:#eaf3fe;
    --green:#1a7f4b; --green-t:#e7f4ec; --amber:#8a6100; --amber-t:#fbf1dc;
    --purple:#5a41b0; --purple-t:#efeafc; --gray-t:#eef0f2;
    --fred:#b3261e; --forange:#b5771a; --ok:#1a7f4b; --drop:#b3261e;
    --radius:14px; --radius-sm:10px; --pill:980px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
  /* Header (예전 위치: 네이비 바) */
  header.top{background:var(--navy);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top h1{margin:0;font-size:17px;font-weight:640;letter-spacing:-0.02em}
  .tag{font-size:11px;background:rgba(255,255,255,.12);color:#e7ecf3;padding:3px 9px;border-radius:var(--pill);font-weight:600}
  header.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  header.top .cyc{font-size:12px;color:#aeb9c8}
  .hbtn{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;cursor:pointer}
  .hbtn:hover{background:rgba(255,255,255,.13)}
  .hbtn.on{background:var(--blue);border-color:var(--blue)}
  .who{font-size:12px;color:#e7ecf3;border:1px solid rgba(255,255,255,.18);border-radius:var(--pill);padding:4px 11px;cursor:pointer}
  .adminonly{display:none} body.admin .adminonly{display:inline-flex}
  .wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 52px)}
  /* Sidebar (예전 구조) */
  aside{background:var(--surface);border-right:1px solid var(--line);padding:14px;overflow:auto}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;text-align:center;font-size:12px;font-weight:600;padding:7px 0;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface);color:var(--ink-2)}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;font-family:inherit;background:var(--surface-2)}
  .search:focus{outline:2px solid var(--blue);background:var(--surface)}
  .sortrow{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:11px;color:var(--muted)}
  .sortopt{cursor:pointer;padding:3px 9px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:560}
  .sortopt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .lpitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .lpitem:hover{box-shadow:var(--shadow)}
  .lpitem.active{background:var(--navy);border-color:var(--navy);box-shadow:var(--shadow)}
  .lpitem.active .nm,.lpitem.active .meta{color:#fff}
  .nmrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .nm{font-weight:640;font-size:14.5px;letter-spacing:-0.01em}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .lpitem.active .meta{color:#b9c6d8}
  .row-tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .tierbadge{font-size:11px;padding:2px 8px;border-radius:var(--pill);font-weight:640;white-space:nowrap}
  .tierbadge.기존{background:var(--green-t);color:var(--green)}
  .tierbadge.신규{background:var(--blue-tint);color:var(--blue)}
  .lpitem.active .tierbadge{background:rgba(255,255,255,.16);color:#fff}
  .ftag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill)}
  .ftag.red{background:var(--fred);color:#fff}.ftag.orange{background:var(--forange);color:#fff}.ftag.grey{background:var(--gray-t);color:var(--ink-2)}
  .badge{font-size:11px;padding:2px 8px;border-radius:var(--pill);background:var(--gray-t);color:var(--ink-2);font-weight:560}
  .lpitem.active .badge{background:rgba(255,255,255,.16);color:#fff}
  .pendbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill);background:var(--amber-t);color:var(--amber)}
  .adminadd{margin-top:6px;font-size:13px;font-weight:560;text-align:center;padding:10px;border:1px dashed var(--line-2);border-radius:12px;color:var(--blue);cursor:pointer;background:var(--surface)}
  .adminadd:hover{background:var(--blue-tint)}
  /* Main (예전 구조 · 회색 배경 + 흰 박스) */
  main{padding:22px 26px 50px;overflow:auto;background:var(--bg)}
  .lp-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .lp-head h2{margin:0;font-size:23px;font-weight:680;letter-spacing:-0.02em}
  .rel{font-size:11px;padding:2px 9px;border-radius:var(--pill);font-weight:560;background:var(--gray-t);color:var(--ink-2)}
  .del{cursor:pointer;color:var(--drop);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--surface)}
  .subline{color:var(--ink-2);font-size:13px}
  .inv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
  .inv{border-radius:12px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:8px;font-weight:640;letter-spacing:-0.01em}
  .inv.red{background:var(--fred);color:#fff}.inv.orange{background:var(--forange);color:#fff}.inv.grey{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .inv .amt{font-weight:520;opacity:.92}.inv .x{cursor:pointer;opacity:.8;font-weight:700}
  .invadd{font-size:13px;font-weight:560;color:var(--blue);background:var(--blue-tint);border:none;border-radius:12px;padding:7px 13px;cursor:pointer}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 4px}
  .stat{background:var(--surface);border-radius:var(--radius);padding:15px 18px;min-width:150px;box-shadow:var(--shadow-sm)}
  .stat.attn{background:var(--amber-t)}
  .stat .k{font-size:12px;color:var(--ink-2);font-weight:510}
  .stat .v{font-size:24px;font-weight:680;letter-spacing:-0.02em;margin-top:3px}
  .stat.attn .v{color:var(--amber)}
  .stat .v small{font-size:13px;font-weight:500;color:var(--muted)}
  h3.sec{font-size:12px;font-weight:640;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
  h3.sec .mini{font-size:12px;font-weight:560;letter-spacing:0;text-transform:none;color:var(--blue);cursor:pointer}
  .contacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ctc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
  .ctc b{color:var(--ink);font-weight:620}.ctc span{color:var(--muted);font-size:12px}.ctc .em{color:var(--blue);font-size:12px}.ctc .x{cursor:pointer;color:var(--drop);font-weight:700}
  .tl{position:relative;margin-left:8px;padding-left:24px;border-left:2px solid var(--line)}
  .ev{position:relative;margin-bottom:18px}
  .ev::before{content:"";position:absolute;left:-31px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--navy)}
  .ev .date{font-size:12px;color:var(--muted);font-weight:600}
  .ev .body{background:var(--surface);border-radius:14px;padding:12px 15px;margin-top:5px;box-shadow:var(--shadow-sm)}
  .ev .txt{font-size:14px;letter-spacing:-0.01em}
  .ev .foot{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ev .foot a{color:var(--blue);text-decoration:none;font-weight:510}
  .chip,.relpill{font-size:11px;padding:2px 8px;border-radius:var(--pill);background:var(--gray-t);color:var(--ink-2);font-weight:560}
  .src{font-size:11px;padding:2px 8px;border-radius:var(--pill);font-weight:590}
  .src.teams{background:var(--purple-t);color:var(--purple)}.src.email{background:var(--blue-tint);color:var(--blue)}.src.calendar{background:var(--amber-t);color:var(--amber)}
  .pending-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
  .pending-wrap .note{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .pcard.dup{opacity:.68}
  .pcard .txt{font-size:14px}
  .pcard .foot{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pcard .foot a{color:var(--blue);text-decoration:none;font-weight:510}
  .dupflag{font-size:11px;font-weight:640;color:var(--amber);background:var(--amber-t);padding:2px 8px;border-radius:var(--pill)}
  .pcard .btns{margin-top:12px;display:flex;gap:9px}
  .btn{font-size:13px;font-weight:560;padding:7px 16px;border-radius:var(--pill);border:none;cursor:pointer;letter-spacing:-0.01em;transition:.12s}
  .btn.appr{background:var(--ok);color:#fff}.btn.appr:hover{background:#166b41}
  .btn.rej{background:var(--gray-t);color:var(--ink)}.btn.rej:hover{background:#e3e5e8}
  .btn.primary{background:var(--blue);color:#fff}.btn.plain{background:var(--gray-t);color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}
  .empty{color:var(--muted);font-size:13px;font-style:italic}
  /* admin table */
  .atbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
  .atbl th,.atbl td{padding:9px 11px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
  .atbl th{background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:640}
  .atbl th.fRED{background:var(--fred);color:#fff}.atbl th.fORANGE{background:var(--forange);color:#fff}.atbl th.fgrey{background:#5b636e;color:#fff}
  .atbl td input,.atbl td select{width:100%;border:1px solid transparent;background:transparent;font-size:13px;padding:5px 6px;border-radius:8px;font-family:inherit;color:var(--ink)}
  .atbl td input:focus,.atbl td select:focus{border-color:var(--blue);background:var(--surface);outline:none}
  .atbl td.amt input{text-align:right}.atbl .cur{color:var(--muted);font-size:11px}
  .tblbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  /* modal / toast */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:60}
  .ov.show{display:flex}
  .modal{background:var(--surface);border-radius:18px;padding:22px 24px;width:400px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h4{margin:0 0 12px;font-size:17px;font-weight:640}
  .modal label{display:block;font-size:12.5px;color:var(--ink-2);margin:12px 0 4px;font-weight:510}
  .modal input,.modal select{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;font-family:inherit}
  .modal .row{display:flex;gap:8px}.modal .row>*{flex:1}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .rosterrow{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:7px;font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(30,30,32,.93);backdrop-filter:blur(10px);color:#fff;padding:11px 20px;border-radius:var(--pill);font-size:13.5px;font-weight:510;opacity:0;transition:.26s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:70;display:flex;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast .undo{margin-left:14px;color:#5ac8fa;font-weight:640;cursor:pointer}

  .lockscreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f2440,#1b3a63)}
  .lockbox{background:var(--surface);border-radius:20px;padding:34px 30px;width:340px;max-width:90vw;box-shadow:var(--shadow);text-align:center}
  .locktitle{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-0.02em}
  .locksub{font-size:13px;color:var(--ink-2);margin:6px 0 18px}
  .lockbox input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;font-size:15px;margin-bottom:10px;font-family:inherit}
  .lockbox button{width:100%;padding:11px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .lockerr{display:none;color:var(--drop);font-size:12.5px;margin-top:10px}
  body.locked{overflow:hidden}
</style>
</head>
<body class="locked">
<div id="lock" class="lockscreen"><div class="lockbox">
  <div class="locktitle">ARK LP CRM</div>
  <div class="locksub">접근 암호를 입력하세요 (내부 전용)</div>
  <input id="pw" type="password" placeholder="암호" autocomplete="off">
  <button onclick="unlock()">열기</button>
  <div id="lockerr" class="lockerr">암호가 올바르지 않습니다.</div>
</div></div>
<header class="top">
  <h1>ARK &amp; Partners — LP / Counterparty CRM</h1><span class="tag">POC · TEST</span>
  <div class="right">
    <span class="cyc">갱신주기 <b style="color:#e7ecf3">매주 1회</b></span>
    <span class="who" id="who" onclick="switchUser()">—</span>
    <button class="hbtn" id="admBtn" onclick="toggleAdmin()">관리자 모드</button>
    <button class="hbtn adminonly" id="tblBtn" onclick="toggleTable()">관리자 표</button>
    <button class="hbtn adminonly" onclick="manageAdmins()">관리자 관리</button>
    <button class="hbtn adminonly" onclick="openData()">열기</button>
    <button class="hbtn adminonly" onclick="saveData()">저장</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
</header>
<div class="wrap">
  <aside>
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" placeholder="검색 (이름·약칭·담당자)" oninput="renderList()">
    <div class="sortrow" id="sortrow"></div>
    <div id="lplist"></div>
    <div class="adminadd adminonly" style="display:none" onclick="addLP()">＋ LP 추가</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
/* ===== 공유 데이터 계약 (실운영: SharePoint의 lp_crm_data.json) — 스키마·로직 불변 ===== */
let DATA = null;
/* ===== state ===== */
let activeId="woori-bank", adminMode=false, viewMode="detail", regionTab="전체", sortMode="default", adminHintShown=false, lastReject=null;
let currentUser="게스트";
const relLabel={lp:"LP · 출자",lender:"대주 · 차입",borrow:"차입처"};
const srcLabel={teams:"Teams",email:"메일",calendar:"일정"};
let ingested=new Set();
function rebuildLedger(){ingested=new Set();(DATA&&DATA.lps?DATA.lps:[]).forEach(lp=>lp.logs.forEach(l=>ingested.add(l.msg)));}
rebuildLedger();

/* ===== helpers ===== */
function isAdmin(u){return (DATA.admins||[]).map(x=>x.toLowerCase()).includes((u||"").toLowerCase());}
function refreshWho(){document.getElementById("who").textContent="접속: "+currentUser+(isAdmin(currentUser)?" · 관리자":"");}
function fundClass(f){const x=(f||"").toLowerCase();return x.includes("red")?"red":x.includes("orange")?"orange":"grey";}
function fmtAmt(lp,a){if(!a)return "";return lp.region==="해외"?("USD "+a+"MM"):(a+"억");}
function autoTier(lp){if((lp.investments||[]).some(v=>String(v.amount||"").trim()!==""))lp.tier="기존";}

/* ===== admin / user ===== */
function toggleAdmin(){if(!isAdmin(currentUser)){toast("관리자 권한이 없습니다 — 접속 신원을 확인하세요");return;}
  adminMode=!adminMode;document.body.classList.toggle("admin",adminMode);document.getElementById("admBtn").classList.toggle("on",adminMode);
  document.querySelector(".adminadd").style.display=adminMode?"block":"none";
  if(!adminMode&&viewMode==="table"){viewMode="detail";document.getElementById("tblBtn").classList.remove("on");}
  renderMain();
  if(adminMode&&!adminHintShown){adminHintShown=true;toast("관리자 모드 ON — 각 항목의 ＋/✕, 상단 '관리자 표'에서 편집");}
  else toast(adminMode?"관리자 모드 ON":"관리자 모드 OFF");}
function toggleTable(){viewMode=viewMode==="table"?"detail":"table";document.getElementById("tblBtn").classList.toggle("on",viewMode==="table");renderMain();}
function switchUser(){modal(`<h4>사용자 전환 (테스트용)</h4><div class="empty" style="margin-bottom:6px">실배포 시 Microsoft SSO 신원으로 자동 설정됩니다.</div><label>이름 / 이메일</label><input id="u_name" value="${currentUser}"><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doSwitch()">전환</button></div>`);}
function doSwitch(){currentUser=document.getElementById("u_name").value.trim()||"게스트";if(!isAdmin(currentUser)&&adminMode){adminMode=false;document.body.classList.remove("admin");document.getElementById("admBtn").classList.remove("on");document.querySelector(".adminadd").style.display="none";viewMode="detail";document.getElementById("tblBtn").classList.remove("on");}closeModal();refreshWho();renderMain();toast("접속: "+currentUser);}
function manageAdmins(){const rows=(DATA.admins||[]).map((a,i)=>`<div class="rosterrow"><span>${a}</span><button class="btn plain" ${DATA.admins.length<=1?"disabled":""} onclick="delAdmin(${i})">회수</button></div>`).join("");
  modal(`<h4>관리자 관리</h4><div class="empty" style="margin-bottom:8px">실배포 시 M365/Entra 신원과 대조됩니다.</div>${rows}<label>관리자 추가</label><input id="a_new" placeholder="예: Ahra Cho"><div class="acts"><button class="btn plain" onclick="closeModal()">닫기</button><button class="btn primary" onclick="addAdmin()">추가</button></div>`);}
function addAdmin(){const v=document.getElementById("a_new").value.trim();if(!v){toast("이름 입력");return;}if(!isAdmin(v))DATA.admins.push(v);manageAdmins();refreshWho();toast("관리자 추가됨");}
function delAdmin(i){if(DATA.admins.length<=1){toast("최소 1명 필요");return;}DATA.admins.splice(i,1);manageAdmins();refreshWho();toast("회수됨");}

/* ===== sidebar ===== */
function renderTabs(){document.getElementById("tabs").innerHTML=["전체","국내","해외"].map(t=>`<div class="tab ${regionTab===t?"on":""}" onclick="setTab('${t}')">${t}</div>`).join("");}
function setTab(t){regionTab=t;const list=filtered();if(!list.find(l=>l.id===activeId))activeId=list[0]?.id;renderTabs();renderList();renderMain();}
function filtered(){const q=(document.getElementById("search")?.value||"").toLowerCase();
  let list=DATA.lps.filter(lp=>{if(!(regionTab==="전체"||lp.region===regionTab))return false;if(!q)return true;
    const hay=[lp.name,lp.short,lp.summary,...(lp.aliases||[]),...(lp.contacts||[]).map(c=>c.n),...(lp.contacts||[]).map(c=>c.email||"")].join(" ").toLowerCase();return hay.includes(q);});
  if(sortMode==="pending")list=[...list].sort((a,b)=>b.pending.length-a.pending.length);
  else if(sortMode==="name")list=[...list].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  return list;}
function renderSort(){document.getElementById("sortrow").innerHTML="정렬 "+[["default","기본"],["pending","승인대기순"],["name","이름순"]].map(([k,l])=>`<span class="sortopt ${sortMode===k?"on":""}" onclick="setSort('${k}')">${l}</span>`).join("");}
function setSort(m){sortMode=m;renderSort();renderList();}
function renderList(){const el=document.getElementById("lplist");el.innerHTML="";
  filtered().forEach(lp=>{const d=document.createElement("div");d.className="lpitem"+(lp.id===activeId?" active":"");
    d.onclick=()=>{activeId=lp.id;if(viewMode==="table"){viewMode="detail";document.getElementById("tblBtn").classList.remove("on");}renderList();renderMain();};
    const ftags=[...new Set((lp.investments||[]).map(v=>v.fund))].map(f=>`<span class="ftag ${fundClass(f)}">${f}</span>`).join("");
    d.innerHTML=`<div class="nmrow"><span class="nm">${lp.name}</span><span class="tierbadge ${lp.tier}">${lp.tier}</span></div>
      <div class="meta">${lp.summary||relLabel[lp.relations[0]]||""}</div>
      <div class="row-tags">${ftags}<span class="badge">로그 ${lp.logs.length}</span>${lp.pending.length?`<span class="pendbadge">승인대기 ${lp.pending.length}</span>`:""}</div>`;
    el.appendChild(d);});}

/* ===== main detail ===== */
function evFoot(l){return `<span class="src ${l.source||'teams'}">${srcLabel[l.source||'teams']}</span><span class="relpill">${relLabel[l.rel||'lp']}</span><span>기록 · ${l.by}</span><a href="${l.url}" target="_blank">원문 열기 ›</a>`;}
function renderMain(){
  if(viewMode==="table"){renderTable();return;}
  const lp=DATA.lps.find(l=>l.id===activeId)||filtered()[0];
  if(!lp){document.getElementById("main").innerHTML=`<div class="empty">이 탭에 LP가 없습니다.</div>`;return;}
  activeId=lp.id;
  const rels=lp.relations.map(r=>`<span class="rel">${relLabel[r]}</span>`).join(" ");
  const invCards=(lp.investments||[]).map((v,i)=>`<span class="inv ${fundClass(v.fund)}">${v.fund}${v.amount?` <span class="amt">${fmtAmt(lp,v.amount)}</span>`:""}${adminMode?` <span class="x" onclick="delInv('${lp.id}',${i})">✕</span>`:""}</span>`).join("");
  const invRow=`<div class="inv-row">${invCards||(adminMode?"":`<span class="empty">출자 펀드 없음</span>`)}${adminMode?`<button class="invadd" onclick="addInv('${lp.id}')">＋ 출자펀드</button>`:""}</div>`;
  const contacts=(lp.contacts.length?lp.contacts.map((c,i)=>`<div class="ctc"><b>${c.n}</b> <span>${c.r||""}</span>${c.email?` <span class="em">${c.email}</span>`:""}${adminMode?` <span class="x" onclick="delContact('${lp.id}',${i})">✕</span>`:""}</div>`).join(""):`<div class="empty">등록된 담당자 없음</div>`);
  const logs=lp.logs.length?`<div class="tl">`+lp.logs.map(l=>`<div class="ev"><div class="date">${l.date}</div><div class="body"><div class="txt">${l.txt}</div><div class="foot">${evFoot(l)}</div></div></div>`).join("")+`</div>`:`<div class="empty">아직 승인된 로그가 없습니다.</div>`;
  const pend=lp.pending.length?lp.pending.map((p,i)=>{const isDup=ingested.has(p.msg)||p.dup;
    return `<div class="pcard ${isDup?"dup":""}"><div class="txt">${p.txt}</div><div class="foot"><span>${p.date}</span><span class="src ${p.source||'teams'}">${srcLabel[p.source||'teams']}</span><span>수집 · ${p.by}</span><a href="${p.url}" target="_blank">원문 열기 ›</a>${isDup?`<span class="dupflag">중복</span>`:""}</div><div class="btns"><button class="btn appr" ${isDup?"disabled":""} onclick="approve('${lp.id}',${i})">승인 → 대시보드</button><button class="btn rej" onclick="reject('${lp.id}',${i})">반려</button></div></div>`;}).join(""):`<div class="empty">승인 대기 항목이 없습니다.</div>`;
  document.getElementById("main").innerHTML=`
    <div class="lp-head"><h2>${lp.name}</h2> <span class="tierbadge ${lp.tier}">${lp.tier}</span> ${rels}${adminMode?`<button class="del" onclick="editLP('${lp.id}')">속성 편집</button><button class="del" onclick="delLP('${lp.id}')">LP 삭제</button>`:""}</div>
    <div class="subline">${lp.region}${lp.short?" · 약칭 "+lp.short:""}${lp.summary?" · "+lp.summary:""}</div>
    ${invRow}
    <div class="stat-row"><div class="stat"><div class="k">누적 로그</div><div class="v">${lp.logs.length}<small> 건</small></div></div><div class="stat ${lp.pending.length?"attn":""}"><div class="k">승인 대기</div><div class="v">${lp.pending.length}<small> 건</small></div></div><div class="stat"><div class="k">담당자</div><div class="v">${lp.contacts.length}<small> 명</small></div></div></div>
    <h3 class="sec">주요 담당자 (Key Contacts)${adminMode?`<span class="mini" onclick="addContact('${lp.id}')">＋ 담당자</span>`:""}</h3><div class="contacts">${contacts}</div>
    <h3 class="sec">상호작용 타임라인 (Interaction Log)</h3><div class="tl-wrap">${logs}</div>
    <h3 class="sec">승인 대기 큐 (Review Queue) · 매주 갱신</h3>
    <div class="pending-wrap"><div class="note">각자 Teams·메일·일정에서 수집된 후보입니다. 승인 시 타임라인으로 이동하고, 고유 id 중복은 자동 차단됩니다.</div>${pend}</div>`;
}

/* ===== admin table ===== */
function renderTable(){const funds=DATA.funds||[];
  const head=`<tr><th>LP (표시명)</th><th>약칭</th><th>지역</th><th>기존/신규</th><th>한줄요약</th>${funds.map(f=>`<th class="f${fundClass(f)==='red'?'RED':fundClass(f)==='orange'?'ORANGE':'grey'}">${f}<div class="cur" style="opacity:.85">금액만</div></th>`).join("")}</tr>`;
  const rows=DATA.lps.map(lp=>{const fcells=funds.map(f=>{const inv=(lp.investments||[]).find(x=>x.fund===f);const val=inv?inv.amount:"";
      return `<td class="amt"><input value="${val}" placeholder="—" oninput="setAmt('${lp.id}','${f}',this.value)"><div class="cur" style="text-align:right">${lp.region==="해외"?"USD MM":"억"}</div></td>`;}).join("");
    return `<tr><td><b>${lp.name}</b></td>
      <td><input value="${(lp.short||'').replace(/"/g,'&quot;')}" placeholder="약칭" oninput="setLP('${lp.id}','short',this.value)"></td>
      <td><select onchange="setLP('${lp.id}','region',this.value)"><option ${lp.region==="국내"?"selected":""}>국내</option><option ${lp.region==="해외"?"selected":""}>해외</option></select></td>
      <td><select onchange="setLP('${lp.id}','tier',this.value)"><option ${lp.tier==="기존"?"selected":""}>기존</option><option ${lp.tier==="신규"?"selected":""}>신규</option></select></td>
      <td><input value="${(lp.summary||'').replace(/"/g,'&quot;')}" placeholder="한줄요약" oninput="setLP('${lp.id}','summary',this.value)"></td>${fcells}</tr>`;}).join("");
  document.getElementById("main").innerHTML=`
    <div class="lp-head"><h2>관리자 표</h2></div>
    <div class="subline">엑셀식 · 금액만 입력(국내 억 / 해외 USD MM 자동) · 금액 넣으면 자동 '기존' · 표시명은 정식명, 검색은 약칭</div>
    <div class="tblbar" style="margin-top:14px"><button class="btn primary" onclick="addLP()">＋ LP 추가</button><button class="btn plain" onclick="addFund()">＋ 펀드 열 추가</button><button class="btn plain" onclick="toggleTable()">상세 보기로</button></div>
    <div style="overflow:auto"><table class="atbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
function setLP(id,k,v){const lp=DATA.lps.find(l=>l.id===id);lp[k]=v;if(k==="region")renderTable();renderList();}
function setAmt(id,fund,v){const lp=DATA.lps.find(l=>l.id===id);lp.investments=lp.investments||[];let inv=lp.investments.find(x=>x.fund===fund);v=v.trim();
  if(!inv){if(v)lp.investments.push({fund,amount:v});}else{if(v)inv.amount=v;else lp.investments=lp.investments.filter(x=>x.fund!==fund);}
  autoTier(lp);renderList();}
function addFund(){modal(`<h4>펀드 열 추가</h4><label>펀드 이름</label><input id="nf" placeholder="예: Rubicon II"><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAddFund()">추가</button></div>`);}
function doAddFund(){const n=document.getElementById("nf").value.trim();if(!n){toast("이름 입력");return;}DATA.funds=DATA.funds||[];if(!DATA.funds.includes(n))DATA.funds.push(n);closeModal();renderTable();toast("펀드 추가됨");}

/* ===== toast / modal ===== */
function toast(t,undoFn){const el=document.getElementById("toast");el.innerHTML="";el.appendChild(document.createTextNode(t));
  if(undoFn){const u=document.createElement("span");u.className="undo";u.textContent="실행취소";u.onclick=()=>{el.classList.remove("show");undoFn();};el.appendChild(u);}
  el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),undoFn?5000:1800);}
function modal(html){document.getElementById("modal").innerHTML=html;document.getElementById("ov").classList.add("show");}
function closeModal(){document.getElementById("ov").classList.remove("show");}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});

/* ===== approve / reject / undo ===== */
function approve(id,i){const lp=DATA.lps.find(l=>l.id===id);const p=lp.pending[i];if(ingested.has(p.msg)){toast("이미 등록됨 (중복)");return;}
  lp.logs.unshift({date:p.date,rel:p.rel,source:p.source||"teams",txt:p.txt,by:p.by+" (승인)",status:"approved",url:p.url,msg:p.msg});
  lp.logs.sort((a,b)=>b.date.localeCompare(a.date));ingested.add(p.msg);lp.pending.splice(i,1);renderList();renderMain();toast("승인됨 · 타임라인에 추가");}
function reject(id,i){const lp=DATA.lps.find(l=>l.id===id);const item=lp.pending[i];lastReject={id,item,idx:i};lp.pending.splice(i,1);renderList();renderMain();toast("반려됨",undoReject);}
function undoReject(){if(!lastReject)return;const lp=DATA.lps.find(l=>l.id===lastReject.id);if(lp)lp.pending.splice(Math.min(lastReject.idx,lp.pending.length),0,lastReject.item);lastReject=null;renderList();renderMain();toast("복구됨");}

/* ===== admin edit ===== */
function addLP(){modal(`<h4>LP / 카운터파티 추가</h4><label>표시명(정식명)</label><input id="f_name" placeholder="예: Federated Hermes"><label>약칭(검색용)</label><input id="f_short" placeholder="예: Hermes">
  <div class="row"><div><label>지역</label><select id="f_region"><option>국내</option><option>해외</option></select></div><div><label>기존/신규</label><select id="f_tier"><option>신규</option><option>기존</option></select></div></div>
  <label>관계 유형</label><select id="f_rel"><option value="lp">LP · 출자</option><option value="lender">대주 · 차입</option><option value="borrow">차입처</option></select>
  <label>한줄 설명 (선택)</label><input id="f_sum"><label>검색 유사명 (쉼표 구분)</label><input id="f_alias" placeholder="비우면 표시명+약칭 사용">
  <div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAddLP()">추가</button></div>`);}
function doAddLP(){const n=document.getElementById("f_name").value.trim();if(!n){toast("표시명 입력");return;}
  const id="lp-"+Date.now();const sh=document.getElementById("f_short").value.trim();
  let aliases=document.getElementById("f_alias").value.split(",").map(s=>s.trim()).filter(Boolean);if(!aliases.length){aliases=[n];if(sh)aliases.push(sh);}
  DATA.lps.push({id,name:n,short:sh,relations:[document.getElementById("f_rel").value],region:document.getElementById("f_region").value,tier:document.getElementById("f_tier").value,summary:document.getElementById("f_sum").value.trim(),aliases,exclude:[],backfilled:false,investments:[],contacts:[],logs:[],pending:[]});
  activeId=id;closeModal();renderTabs();renderList();renderMain();toast("LP 추가됨");}
function editLP(id){const lp=DATA.lps.find(l=>l.id===id);
  modal(`<h4>${lp.name} — 속성 편집</h4><label>표시명</label><input id="e_name" value="${(lp.name||'').replace(/"/g,'&quot;')}"><label>약칭</label><input id="e_short" value="${(lp.short||'').replace(/"/g,'&quot;')}">
    <div class="row"><div><label>지역</label><select id="e_region"><option ${lp.region==="국내"?"selected":""}>국내</option><option ${lp.region==="해외"?"selected":""}>해외</option></select></div><div><label>기존/신규</label><select id="e_tier"><option ${lp.tier==="기존"?"selected":""}>기존</option><option ${lp.tier==="신규"?"selected":""}>신규</option></select></div></div>
    <label>한줄 설명</label><input id="e_sum" value="${(lp.summary||'').replace(/"/g,'&quot;')}"><label>검색 유사명 (쉼표)</label><input id="e_alias" value="${(lp.aliases||[]).join(', ')}"><label>검색 배제어 (쉼표)</label><input id="e_excl" value="${(lp.exclude||[]).join(', ')}">
    <div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doEditLP('${id}')">저장</button></div>`);}
function doEditLP(id){const lp=DATA.lps.find(l=>l.id===id);lp.name=document.getElementById("e_name").value.trim()||lp.name;lp.short=document.getElementById("e_short").value.trim();lp.region=document.getElementById("e_region").value;lp.tier=document.getElementById("e_tier").value;lp.summary=document.getElementById("e_sum").value.trim();lp.aliases=document.getElementById("e_alias").value.split(",").map(s=>s.trim()).filter(Boolean);lp.exclude=document.getElementById("e_excl").value.split(",").map(s=>s.trim()).filter(Boolean);closeModal();renderTabs();renderList();renderMain();toast("저장됨");}
function addInv(id){const lp=DATA.lps.find(l=>l.id===id);const funds=DATA.funds||[];modal(`<h4>출자펀드 추가</h4><label>펀드</label><select id="i_fund">${funds.map(f=>`<option>${f}</option>`).join("")}</select><label>금액 (숫자만 · ${lp.region==="해외"?"USD MM":"억"})</label><input id="i_amt" placeholder="비우면 배정만"><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAddInv('${id}')">추가</button></div>`);}
function doAddInv(id){const lp=DATA.lps.find(l=>l.id===id);const f=document.getElementById("i_fund").value;lp.investments=lp.investments||[];if(!lp.investments.find(x=>x.fund===f))lp.investments.push({fund:f,amount:document.getElementById("i_amt").value.trim()});autoTier(lp);closeModal();renderList();renderMain();toast("추가됨");}
function delInv(id,i){DATA.lps.find(l=>l.id===id).investments.splice(i,1);renderList();renderMain();}
function addContact(id){modal(`<h4>담당자 추가</h4><label>이름</label><input id="c_name"><label>직책/메모</label><input id="c_role"><label>이메일 (선택 · 수집 매칭용)</label><input id="c_email" placeholder="예: name@company.com"><div class="acts"><button class="btn plain" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAddContact('${id}')">추가</button></div>`);}
function doAddContact(id){const lp=DATA.lps.find(l=>l.id===id);const n=document.getElementById("c_name").value.trim();if(!n){toast("이름 입력");return;}const c={n,r:document.getElementById("c_role").value.trim()};const em=document.getElementById("c_email").value.trim();if(em)c.email=em;lp.contacts.push(c);closeModal();renderMain();toast("담당자 추가됨");}
function delContact(id,i){DATA.lps.find(l=>l.id===id).contacts.splice(i,1);renderMain();}
function delLP(id){if(!confirm("이 LP를 삭제할까요?"))return;DATA.lps=DATA.lps.filter(l=>l.id!==id);activeId=filtered()[0]?.id;renderTabs();renderList();renderMain();toast("삭제됨");}

/* ===== data file ===== */
function normalize(){DATA.admins=DATA.admins||["admin"];DATA.funds=DATA.funds||["RED","ORANGE","Rubicon","Kosta"];DATA.lps.forEach(l=>{l.short=l.short||"";l.region=l.region||"국내";l.tier=l.tier||"신규";l.relations=l.relations||["lp"];l.aliases=l.aliases||[l.name];l.exclude=l.exclude||[];l.investments=l.investments||[];l.contacts=l.contacts||[];l.logs=l.logs||[];l.pending=l.pending||[];autoTier(l);});}
let fileHandle=null;
async function saveData(){if(window.showSaveFilePicker){try{if(!fileHandle){fileHandle=await window.showSaveFilePicker({suggestedName:"lp_crm_data.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});}const w=await fileHandle.createWritable();await w.write(JSON.stringify(DATA,null,2));await w.close();toast("저장됨 · lp_crm_data.json");return;}catch(e){if(e.name==="AbortError")return;}}exportJSON();}
async function openData(){if(window.showOpenFilePicker){try{const [h]=await window.showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});fileHandle=h;const f=await h.getFile();DATA=JSON.parse(await f.text());normalize();rebuildLedger();activeId=DATA.lps[0]?.id;currentUser=DATA.admins[0];/* gated: unlock 후 렌더 */toast("열기 완료 · 이후 저장은 이 파일에 반영");return;}catch(e){if(e.name==="AbortError")return;}}document.getElementById("imp").click();}
function exportJSON(){const b=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="lp_crm_data.json";a.click();toast("lp_crm_data.json 내보냄");}

function _b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('lockerr'); err.style.display='none';
  if(!(window.crypto&&crypto.subtle)){err.textContent='이 브라우저에서는 복호화를 지원하지 않습니다(https로 여세요).';err.style.display='block';return;}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:_b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64(ENC.iv)},key,_b64(ENC.ct));
    DATA=JSON.parse(new TextDecoder().decode(pt));
    normalize();rebuildLedger();activeId=DATA.lps[0]&&DATA.lps[0].id;currentUser=(DATA.admins&&DATA.admins[0])||'게스트';
    document.getElementById('lock').style.display='none';document.body.classList.remove('locked');
    refreshWho();renderTabs();renderSort();renderList();renderMain();
  }catch(e){err.textContent='암호가 올바르지 않습니다.';err.style.display='block';document.getElementById('pw').value='';}
}
document.addEventListener('keydown',e=>{const L=document.getElementById('lock');if(e.key==='Enter'&&L&&L.style.display!=='none')unlock();});
